<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#263238">
  <title>残量チェック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 最初の画面：データを開く -->
  <section id="start" class="start">
    <h1>残量チェック</h1>
    <p class="lead">打設当日に、残りのコンクリート数量と生コン車の台数を確かめるアプリです</p>
    <label class="bigbtn">データを開く<input type="file" id="fileInput" accept=".json,application/json"></label>
    <p class="note">PCアプリの「タブレット用に書き出す」で作ったファイルを選んでください</p>
    <div id="lastWork" class="lastwork hidden"></div>
    <p id="startError" class="error hidden"></p>
  </section>

  <!-- 作業画面 -->
  <main id="work" class="work hidden">
    <header class="summary">
      <div class="titlerow">
        <div id="title" class="title"></div>
        <button id="undo" class="btn" disabled>元に戻す</button>
      </div>
      <div id="zoneTabs" class="zonetabs hidden"></div>
      <div class="nums">
        <div><span class="lbl">予定</span><span id="planned" class="num"></span></div>
        <div><span class="lbl">打設済み</span><span id="done" class="num"></span></div>
        <div class="restbox"><span class="lbl">残り</span><span id="rest" class="rest"></span></div>
      </div>
      <div id="trucks" class="trucks"></div>
      <div id="restInfo" class="restinfo"></div>
    </header>

    <div id="planWrap" class="planwrap">
      <svg id="plan" class="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i class="sw todo"></i>未打設</span><span><i class="sw pouring"></i>打設中</span><span><i class="sw done"></i>打設済み</span>
        <button id="fit" class="btn small">全体</button>
        <button id="bulk" class="btn small">打設済みをまとめて</button>
      </div>
    </div>

    <footer class="controls">
      <div class="row">
        <label for="depth">柱・梁の打上り：上端 −</label>
        <input id="depth" type="number" inputmode="numeric" min="0" step="10" value="0"><span>mm</span>
      </div>
      <div id="depthNote" class="small muted"></div>
      <div class="row presets">
        <button class="btn" data-preset="slab_bottom_mm">スラブ下</button>
        <button class="btn" data-preset="beam_mid_mm">梁せい中央</button>
        <button class="btn" data-preset="none">未打設（全量）</button>
      </div>
      <div class="row">
        <label for="truck">生コン車</label>
        <input id="truck" type="number" inputmode="decimal" min="0.25" step="0.25"><span>m³／台</span>
        <label for="extra">割増</label>
        <input id="extra" type="number" inputmode="decimal" min="0" step="1"><span>%</span>
      </div>
      <div class="row tools">
        <button id="openOther" class="btn small">別のデータを開く</button>
        <button id="showMissing" class="btn small hidden">含まれない部材</button>
      </div>
    </footer>
  </main>

  <div id="missing" class="sheet hidden">
    <div class="sheetbody">
      <h2>数量に含まれない部材があります</h2>
      <p id="missingLead"></p>
      <ul id="missingList"></ul>
      <button id="missingClose" class="btn">閉じる</button>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
