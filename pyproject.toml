[project]
name = "ifc-concrete-qto"
version = "0.1.0"
description = "IFCのBIMデータから、工区・高さ範囲で切断したコンクリート体積を算出するローカルWebアプリ"
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.8",
    "manifold3d>=3.0",
    "shapely>=2.0",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]  # 数量エンジンのMCPサーバー（backend/mcp_server.py）。2.x は FastMCP の名前と作りが変わったため 1.x に固定
dev = ["pytest", "playwright"]  # playwright：ui-review・site-export-check スキルが画面を自動で動かす（PCのEdgeを使う）

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
