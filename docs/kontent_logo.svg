<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="KONTENT">
  <!-- KONTENT のロゴ（B1：梁つきの断面とコン天の線）＋名前。README の先頭に使う。
       名前の色は、GitHub を暗い表示で見たときにも読めるよう、端末の設定で変える -->
  <style>
    .name { fill: #263238; }
    @media (prefers-color-scheme: dark) { .name { fill: #ECEFF1; } }
  </style>
  <g transform="translate(5 5)">
    <rect x="0" y="0" width="54" height="54" rx="10" fill="#263238"/>
    <path d="M9 22 H45 V29 H33 V44 H21 V29 H9 Z" fill="#B0BEC5"/>
    <line x1="7" y1="22" x2="47" y2="22" stroke="#E8730C" stroke-width="2.5"/>
    <path d="M23 9 L31 9 L27 17 Z" fill="#E8730C"/>
  </g>
  <text class="name" x="74" y="45" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="4">KONTENT</text>
</svg>
